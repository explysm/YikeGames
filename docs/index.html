<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YikeGames Asset Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="glitch-text" data-text="YikeGames Assets">YikeGames Assets</h1>
        <p class="subtitle">Browse and download game assets</p>
    </header>

    <main class="main-content">
        <div id="asset-browser" class="posts-list-container">
            <div id="loading-message" class="loading-message">
                <div class="spinner"></div>
                <p>Loading assets from GitHub...</p>
            </div>
            <!-- Assets will be loaded here by JavaScript -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
